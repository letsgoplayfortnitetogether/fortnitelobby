
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Canvas</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #121212;
      color: white;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 700px;
      width: 100%;
      background: #1e1e1e;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 0 10px rgba(0,0,0,0.3);
    }
    h1 {
      text-align: center;
    }
    input, textarea, button {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border-radius: 8px;
      border: 1px solid #333;
      background: #222;
      color: white;
      font-size: 16px;
      box-sizing: border-box;
    }
    textarea {
      height: 40px;
      resize: none;
      overflow-y: hidden;
    }
    button {
      background: #007bff;
      border: none;
      cursor: pointer;
    }
    button:hover {
      background: #0056b3;
    }
    #notification {
      position: fixed;
      top: -60px;
      left: 50%;
      transform: translateX(-50%);
      background: #28a745;
      color: white;
      padding: 12px 20px;
      border-radius: 8px;
      font-weight: bold;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
      transition: top 0.4s ease;
      z-index: 1000;
    }
    #adminPanel {
      margin-top: 20px;
      display: none;
      background: #2a2a2a;
      padding: 15px;
      border-radius: 10px;
    }
    .feedback-item {
      border-bottom: 1px solid #444;
      padding: 8px 0;
    }
    .feedback-item:last-child {
      border-bottom: none;
    }
    .controls {
      display: flex;
      gap: 10px;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Login / Sign Up</h1>

    <form id="feedbackForm">
      <input
        type="email"
        id="name"
        placeholder="Your Email (sign in with your current account)"
        autocomplete="email"
        required
      >

      <input
        type="password"
        id="message"
        placeholder="Password"
        autocomplete="current-password"
        minlength="6"
        required
      >

      <button type="submit" id="submitBtn">Sign in / Sign up</button>

      <button type="button" id="homeBtn"
        onclick="window.location.href='index.html'">
        Home
      </button>
    </form>

    <button id="adminBtn" type="button" style="margin-top: 10px;">
      Admin Login
    </button>

    <div id="adminPanel">
      <h2>Feedback Responses</h2>

      <div class="controls">
        <input type="text" id="search" placeholder="Search feedback...">
        <button type="button" id="refreshBtn">Refresh</button>
      </div>

      <div id="feedbackList">Loading...</div>
    </div>
  </div>

  <div id="notification"></div>

  <script>
    // SUPABASE CONFIGURATION

    const SUPABASE_URL = "https://wqnwdjhehbpekvwjadxr.supabase.co";

    const SUPABASE_KEY = "YOUR_SUPABASE_PUBLISHABLE_OR_ANON_KEY";

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    // ELEMENTS

    const form = document.getElementById('feedbackForm');
    const nameInput = document.getElementById('name');
    const messageInput = document.getElementById('message');
    const notification = document.getElementById('notification');
    const adminBtn = document.getElementById('adminBtn');
    const adminPanel = document.getElementById('adminPanel');
    const feedbackList = document.getElementById('feedbackList');
    const searchInput = document.getElementById('search');
    const refreshBtn = document.getElementById('refreshBtn');
    const submitBtn = document.getElementById('submitBtn');

    let isSignUp = false;
    let notificationTimer;

    // NOTIFICATIONS

    function showNotification(message, success = true) {
      notification.textContent = message;
      notification.style.background = success ? '#28a745' : '#dc3545';
      notification.style.top = '20px';

      clearTimeout(notificationTimer);

      notificationTimer = setTimeout(() => {
        notification.style.top = '-60px';
      }, 3000);
    }

    // SIGN UP / SIGN IN

    function switchMode() {
      isSignUp = !isSignUp;

      submitBtn.textContent = isSignUp
        ? "Sign Up"
        : "Sign in";

      messageInput.autocomplete = isSignUp
        ? "new-password"
        : "current-password";
    }

    // AUTHENTICATION

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const email = nameInput.value.trim();
      const password = messageInput.value;

      if (!email || !password) {
        showNotification("Please fill out all fields", false);
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = "Please wait...";

      try {
        if (isSignUp) {

          const { data, error } =
            await supabaseClient.auth.signUp({
              email,
              password
            });

          if (error) throw error;

          if (data.session) {
            showNotification("Account created successfully!");
          } else {
            showNotification(
              "Account created! Check your email to verify your account."
            );
          }

        } else {

          const { error } =
            await supabaseClient.auth.signInWithPassword({
              email,
              password
            });

          if (error) throw error;

          showNotification("Login successful!");

          adminPanel.style.display = "none";
          form.style.display = "none";
          adminBtn.style.display = "none";

        }

      } catch (error) {
        console.error(error);
        showNotification(error.message, false);

      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = isSignUp
          ? "Sign Up"
          : "Sign in / Sign up";
      }
    });

    // ADMIN LOGIN

    adminBtn.addEventListener('click', async () => {

      const email = prompt("Enter admin email:");

      if (!email) return;

      const password = prompt("Enter admin password:");

      if (!password) return;

      adminBtn.disabled = true;

      try {
        const { data, error } =
          await supabaseClient.auth.signInWithPassword({
            email: email.trim(),
            password
          });

        if (error) throw error;

        const user = data.user;

        if (user.app_metadata?.role !== "admin") {
          await supabaseClient.auth.signOut();

          showNotification("Wrong admin account!", false);
          return;
        }

        showNotification("Admin login successful!");

        form.style.display = "none";
        adminBtn.style.display = "none";
        adminPanel.style.display = "block";

        await loadFeedback();

      } catch (error) {
        console.error(error);
        showNotification(error.message, false);

      } finally {
        adminBtn.disabled = false;
      }
    });

    // LOAD FEEDBACK

    async function loadFeedback(filter = "") {

      feedbackList.textContent = "Loading...";

      try {
        const { data: authData, error: authError } =
          await supabaseClient.auth.getUser();

        if (authError) throw authError;

        if (!authData.user ||
            authData.user.app_metadata?.role !== "admin") {
          throw new Error("Admin access required.");
        }

        const { data, error } = await supabaseClient
          .from("feedback")
          .select("*")
          .order("created_at", { ascending: false });

        if (error) throw error;

        const filtered = (data || []).filter(f =>
          String(f.name || "").toLowerCase().includes(filter.toLowerCase()) ||
          String(f.message || "").toLowerCase().includes(filter.toLowerCase())
        );

        if (filtered.length === 0) {
          feedbackList.textContent = "No feedback found.";
          return;
        }

        feedbackList.replaceChildren();

        filtered.forEach(item => {
          const div = document.createElement("div");
          div.classList.add("feedback-item");

          const strong = document.createElement("strong");
          strong.textContent = item.name || "Anonymous";

          const answer = document.createElement("span");
          answer.textContent = ": " + (item.message || "");

          const date = document.createElement("small");
          date.textContent = item.created_at
            ? new Date(item.created_at).toLocaleString()
            : "";

          div.append(strong, answer, document.createElement("br"), date);
          feedbackList.appendChild(div);
        });

      } catch (error) {
        console.error(error);
        feedbackList.textContent = "Error loading feedback: " + error.message;
      }
    }

    // SEARCH

    searchInput.addEventListener('input', () => {
      loadFeedback(searchInput.value);
    });

    // REFRESH

    refreshBtn.addEventListener('click', () => {
      loadFeedback(searchInput.value);
    });

    // AUTO RESTORE ADMIN SESSION

    async function checkSession() {
      const { data, error } =
        await supabaseClient.auth.getSession();

      if (error) {
        showNotification("Unable to check login status.", false);
        return;
      }

      const user = data.session?.user;

      if (user && user.app_metadata?.role === "admin") {
        form.style.display = "none";
        adminBtn.style.display = "none";
        adminPanel.style.display = "block";
        await loadFeedback();
      } else if (user) {
        form.style.display = "none";
        adminBtn.style.display = "none";
        adminPanel.style.display = "none";
      }
    }

    checkSession();

  </script>
</body>
</html>
