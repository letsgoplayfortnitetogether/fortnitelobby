
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Menu - Savnac</title>

<link rel="icon" href="https://www.wabash.edu/images2/technology/canvas.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  min-height: 100%;
  font-family: 'Inter', Arial, sans-serif;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

body {
  background: #080912;
  color: white;
  min-height: 100vh;
  padding-top: 65px;
  transition: background .35s, color .35s;
}

/* PARTICLES */

#particles-js {
  position: fixed;
  inset: 0;
  z-index: -2;
  background:
    radial-gradient(ellipse at 20% 20%, #24104b 0%, transparent 45%),
    radial-gradient(ellipse at 80% 80%, #101f4b 0%, transparent 45%),
    #080912;
  transition: background .35s;
}

/* BACKGROUND GLOW */

body::before {
  content: "";
  position: fixed;
  width: 450px;
  height: 450px;
  background: #763bff;
  filter: blur(170px);
  opacity: .13;
  top: 15%;
  left: 10%;
  pointer-events: none;
  z-index: -1;
}

body::after {
  content: "";
  position: fixed;
  width: 400px;
  height: 400px;
  background: #008cff;
  filter: blur(170px);
  opacity: .12;
  bottom: 5%;
  right: 5%;
  pointer-events: none;
  z-index: -1;
}

/* TOP BAR */

.top-bar {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  height: 60px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 22px;
  background: rgba(12, 13, 27, .78);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  border-bottom: 1px solid rgba(255,255,255,.08);
  z-index: 9999;
}

.top-left,
.top-right {
  display: flex;
  align-items: center;
  gap: 12px;
}

/* BUTTONS */

.btn {
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: rgba(255,255,255,.045);
  border: 1px solid rgba(255,255,255,.12);
  color: inherit;
  padding: 10px 17px;
  border-radius: 12px;
  cursor: pointer;
  font-size: 13px;
  font-weight: 600;
  text-decoration: none;
  transition:
    transform .25s ease,
    background .25s ease,
    border-color .25s ease,
    box-shadow .25s ease;
}

.btn:hover {
  transform: translateY(-3px);
  background: rgba(125,85,255,.16);
  border-color: rgba(151,116,255,.7);
  box-shadow:
    0 8px 25px rgba(92,52,255,.2),
    0 0 15px rgba(92,52,255,.12);
}

.btn:active {
  transform: scale(.97);
}

.btn.active {
  background: rgba(125,85,255,.2);
  border-color: #9065ff;
  box-shadow: 0 0 20px rgba(125,85,255,.25);
}

/* PAGE */

.page-wrap {
  display: flex;
  justify-content: center;
  align-items: flex-start;
  padding: 45px 20px 65px;
  min-height: calc(100vh - 60px);
}

.menu-content {
  display: flex;
  flex-direction: column;
  gap: 14px;
  width: 100%;
  max-width: 440px;
  text-align: center;
  padding: 30px;
  border-radius: 25px;
  background: rgba(255,255,255,.035);
  border: 1px solid rgba(255,255,255,.09);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  box-shadow: 0 20px 70px rgba(0,0,0,.3);
  animation: appear .7s ease both;
}

/* HEADINGS */

h1 {
  font-size: 27px;
  font-weight: 900;
  letter-spacing: -1px;
  margin: 12px 0 5px;
  background: linear-gradient(110deg, #fff, #a78bfa, #65caff);
  background-clip: text;
  -webkit-background-clip: text;
  color: transparent;
}

h1:not(:first-child) {
  margin-top: 28px;
  padding-top: 20px;
  border-top: 1px solid rgba(255,255,255,.1);
}

.menu-content::before {
  content: "SAVNAC";
  display: block;
  color: #a78bfa;
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 5px;
  margin-bottom: -10px;
}

/* MENU BUTTONS */

.menu-btn {
  width: 100%;
  min-height: 49px;
  font-size: 14px;
  padding: 13px 15px;
  border-radius: 13px;
  background: linear-gradient(
    110deg,
    rgba(111,75,255,.12),
    rgba(0,153,255,.07)
  );
}

.menu-btn:hover {
  transform: translateY(-4px) scale(1.015);
  background: linear-gradient(
    110deg,
    rgba(111,75,255,.28),
    rgba(0,153,255,.18)
  );
}

/* LIGHT MODE */

body.light-mode {
  background: #f1f3fa;
  color: #17172a;
}

body.light-mode #particles-js {
  background:
    radial-gradient(ellipse at 20% 20%, #e4d9ff 0%, transparent 45%),
    radial-gradient(ellipse at 80% 80%, #d7eaff 0%, transparent 45%),
    #f1f3fa;
}

body.light-mode .top-bar {
  background: rgba(255,255,255,.8);
  border-bottom: 1px solid rgba(0,0,0,.08);
}

body.light-mode .menu-content {
  background: rgba(255,255,255,.72);
  border-color: rgba(0,0,0,.08);
  box-shadow: 0 20px 60px rgba(40,50,100,.12);
}

body.light-mode .btn {
  background: rgba(0,0,0,.035);
  border-color: rgba(0,0,0,.09);
  color: #17172a;
}

body.light-mode .btn:hover {
  background: rgba(115,75,255,.12);
  border-color: #9065ff;
  box-shadow: 0 8px 22px rgba(92,52,255,.12);
}

body.light-mode h1 {
  background: linear-gradient(110deg, #292044, #7544d9, #1479ba);
  background-clip: text;
  -webkit-background-clip: text;
  color: transparent;
}

body.light-mode h1:not(:first-child) {
  border-top-color: rgba(0,0,0,.1);
}

/* ANIMATIONS */

@keyframes appear {
  from {
    opacity: 0;
    transform: translateY(25px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* MOBILE */

@media (max-width: 500px) {
  .menu-content {
    padding: 22px 17px;
    border-radius: 20px;
  }

  .page-wrap {
    padding: 28px 13px 45px;
  }

  h1 {
    font-size: 25px;
  }

  .top-bar {
    padding: 0 13px;
  }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    transition-duration: .01ms !important;
  }
}
</style>
</head>

<body>

<div id="particles-js"></div>

<!-- TOP BAR -->
<div class="top-bar">
  <div class="top-left">
    <a href="index.html" class="btn">⌂ Home</a>
  </div>

  <div class="top-right">
    <button class="btn" id="modeToggle">☀️ / 🌙 Light/Dark</button>
  </div>
</div>

<!-- MENU -->
<div class="page-wrap">
  <div class="menu-content">

    <h1>Menu</h1>

    <a href="https://docs.google.com/forms/d/e/1FAIpQLSc7J2dhhDOt8ef7dzEmVQMAUaOqsjoqcNeSRmEn88MovprbkA/viewform" class="btn menu-btn">
      🎮 Request A Game
    </a>

    <a href="https://docs.google.com/forms/d/e/1FAIpQLSevwFmxFWYbom8AuI7KDOKAuGG8MZk_0jMS2AIe4phWceJgjA/viewform" class="btn menu-btn">
      🐛 Report a Bug/Problem
    </a>

    <a href="https://docs.google.com/forms/d/e/1FAIpQLSehji31zfI016l3-sdpluoi54y5JWDkNM2-MQtPcO0vvGi_KQ/viewform" class="btn menu-btn">
      💬 Your Feedback
    </a>

    <h1>Credits</h1>

    <a href="creditslogo.html" class="btn menu-btn">
      🎨 Logo's
    </a>

    <a href="creditscode.html" class="btn menu-btn">
      💻 Code
    </a>

    <h1>Test Features</h1>

    <a href="voicecommand.html" class="btn menu-btn">
      🎤 VOICE COMMANDS
    </a>

    <a href="new-layout.html" class="btn menu-btn">
      ✨ New layout
    </a>

    <a href="sign-in.html" class="btn menu-btn">
      🍍 Sign in
    </a>

    <a href="ai.html" class="btn menu-btn">
      🤖 savnac AI (ChatSAC)
    </a>

  </div>
</div>

<!-- PARTICLES SCRIPT -->
<script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>

<script>

// LIGHT / DARK MODE
const modeToggle = document.getElementById("modeToggle");

modeToggle.addEventListener("click", () => {
  document.body.classList.toggle("light-mode");

  modeToggle.textContent =
    document.body.classList.contains("light-mode")
      ? "🌙 Dark Mode"
      : "☀️ Light/Dark";
});

// AUTOMATIC MENU HIGHLIGHT
if (window.location.pathname.endsWith("menu.html")) {
  const menuBtn = document.getElementById("menuBtn");
  if (menuBtn) menuBtn.classList.add("active");
}

// PARTICLE BACKGROUND
if (window.particlesJS) {
  particlesJS("particles-js", {
    particles: {
      number: {
        value: 65,
        density: {
          enable: true,
          value_area: 900
        }
      },
      color: {
        value: ["#9670ff", "#36aaff", "#ffffff"]
      },
      shape: {
        type: "circle"
      },
      opacity: {
        value: 0.4,
        random: true
      },
      size: {
        value: 3,
        random: true
      },
      line_linked: {
        enable: true,
        distance: 150,
        color: "#8b70ff",
        opacity: 0.18,
        width: 1
      },
      move: {
        enable: true,
        speed: 1.5,
        direction: "none",
        random: false,
        straight: false,
        out_mode: "out",
        bounce: false
      }
    },
    interactivity: {
      detect_on: "canvas",
      events: {
        onhover: {
          enable: true,
          mode: "grab"
        },
        onclick: {
          enable: true,
          mode: "push"
        },
        resize: true
      },
      modes: {
        grab: {
          distance: 140,
          line_linked: {
            opacity: 0.5
          }
        },
        push: {
          particles_nb: 3
        }
      }
    },
    retina_detect: true
  });
}

</script>

</body>
</html>
