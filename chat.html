<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Canvas</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --private-bg: #290d30;
      --private-primary: #a855f7;
      --public-bg: #111827;
      --public-primary: #10b981;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--public-bg);
      transition: background-color 0.4s ease;
    }

    .private-mode {
      background-color: var(--private-bg);
    }

    /* Smooth button tactile feel */
    button {
      cursor: pointer;
    }
  </style>
</head>
<body id="chatBody" class="min-h-screen flex flex-col items-center p-4 transition-colors">

  <h1 id="titleText" class="text-4xl font-extrabold mb-8 mt-6 tracking-wide transition-colors" style="color: var(--public-primary);">
    Public Chat
  </h1>

  <div class="w-full max-w-4xl flex flex-col lg:flex-row gap-6">
    <!-- Message List Container -->
    <div class="flex-1 bg-gray-800 rounded-xl shadow-2xl overflow-hidden flex flex-col h-[500px] border border-gray-700">
      <div id="chatTitleContainer" class="p-4 text-white font-semibold text-lg transition-colors" style="background-color: var(--public-primary);">
        <h2 class="text-white">Messages</h2>
      </div>
      <ul id="feedbackList" class="flex-1 overflow-y-auto space-y-2 p-4 text-gray-200">
        <!-- Messages will be injected here -->
      </ul>
    </div>

    <!-- Input and Controls Container -->
    <div class="lg:w-96 bg-gray-800 p-6 rounded-xl shadow-2xl border border-gray-700 flex flex-col">
      <input type="text" id="name" placeholder="Your Name" maxlength="30"
        class="w-full p-3 mb-4 rounded-xl bg-gray-700/80 text-white placeholder-gray-400 focus:outline-none focus:ring-2 border border-gray-600 transition-all">

      <textarea id="feedback" placeholder="Your Message (Max 200 chars)" maxlength="200"
        class="w-full h-24 p-3 mb-5 rounded-xl bg-gray-700/80 text-white placeholder-gray-400 focus:outline-none focus:ring-2 border border-gray-600 resize-none transition-all"></textarea>

      <!-- Action Buttons -->
      <div class="flex flex-col space-y-3">
        <button id="sendBtn"
          class="group w-full py-3.5 px-4 rounded-xl font-bold text-white flex items-center justify-center gap-2 transition-all duration-200 transform hover:-translate-y-0.5 active:translate-y-0 active:scale-[0.98] shadow-lg">
          <span>Send Message</span>
          <svg class="w-4 h-4 transition-transform duration-200 group-hover:translate-x-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M14 5l7 7m0 0l-7 7m7-7H3" />
          </svg>
        </button>

        <button id="privateBtn"
          class="w-full py-3 px-4 rounded-xl font-semibold text-indigo-300 bg-indigo-500/10 hover:bg-indigo-500/20 border border-indigo-500/30 hover:border-indigo-400/60 flex items-center justify-center gap-2 transition-all duration-200 transform hover:-translate-y-0.5 active:translate-y-0 active:scale-[0.98]">
          <svg id="lockIcon" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
          </svg>
          <span id="privateBtnText">Switch to Private Chat</span>
        </button>
      </div>

      <!-- Divider -->
      <div class="border-t border-gray-700/80 my-4"></div>

      <!-- Utility Buttons -->
      <div class="flex space-x-3">
        <button id="homeBtn"
          class="flex-1 py-2.5 px-3 rounded-xl font-medium text-gray-300 bg-gray-700/60 hover:bg-gray-700 border border-gray-600/50 hover:border-gray-500 flex items-center justify-center gap-1.5 transition-all duration-200 active:scale-[0.97] text-sm">
          <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
          </svg>
          <span>Home</span>
        </button>

        <button id="deleteAllBtn"
          class="flex-1 py-2.5 px-3 rounded-xl font-medium text-red-400 bg-red-500/10 hover:bg-red-600 hover:text-white border border-red-500/30 hover:border-red-600 flex items-center justify-center gap-1.5 transition-all duration-200 active:scale-[0.97] text-sm">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
          </svg>
          <span>Delete All</span>
        </button>
      </div>
    </div>
  </div>

  <script>
    const sendBtn = document.getElementById('sendBtn');
    const feedbackList = document.getElementById('feedbackList');
    const privateBtn = document.getElementById('privateBtn');
    const privateBtnText = document.getElementById('privateBtnText');
    const deleteAllBtn = document.getElementById('deleteAllBtn');
    const chatBody = document.getElementById('chatBody');
    const chatTitleContainer = document.getElementById('chatTitleContainer');
    const titleText = document.getElementById('titleText');
    const nameInput = document.getElementById('name');
    const feedbackInput = document.getElementById('feedback');

    let privateRoom = false;
    const STORAGE_KEY = 'canvas_chat_messages';
    const PUBLIC_CODE = "Switch to Private Chat";
    const PRIVATE_CODE = "Switch to Public Chat";

    const badWordsList = [
      'nigga','nigger','dick','shit','ass','cum','fuck','penis','vagina','bitch','slut','whore',
      'niger','niga','ho','cumming','fag',
      '@ss','@$$','a$$','sh!t','sh1t','d!ck','f*ck','n!gger','n1gger',
    ];

    function containsBadWords(text) {
      const normalizedText = text.toLowerCase();
      for (const word of badWordsList) {
        const wordRegex = new RegExp(`\\b${word}\\b`, 'g');
        if (wordRegex.test(normalizedText)) {
          return true;
        }
        if (['@ss', '@$$', 'sh!t', 'sh1t', 'd!ck', 'f*ck'].includes(word) && normalizedText.includes(word)) {
          return true;
        }
      }
      return false;
    }

    function maskBadWords(text) {
      let masked = text;
      for (const word of badWordsList) {
        const wordRegex = new RegExp(`\\b${word}\\b`, 'gi');
        if (wordRegex.test(masked)) {
          masked = masked.replace(wordRegex, (match) => '*'.repeat(match.length));
        }
      }
      return masked;
    }

    function getMessages() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
      } catch {
        return [];
      }
    }

    function saveMessages(messages) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(messages));
    }

    function updateTheme() {
      const currentPrimary = privateRoom ? 'var(--private-primary)' : 'var(--public-primary)';
      const glowColor = privateRoom ? 'rgba(168, 85, 247, 0.35)' : 'rgba(16, 185, 129, 0.35)';

      chatBody.classList.toggle('private-mode', privateRoom);
      titleText.textContent = privateRoom ? 'Private Chat' : 'Public Chat';
      titleText.style.color = currentPrimary;
      chatTitleContainer.style.backgroundColor = currentPrimary;

      // Primary Send Button styling & dynamic glow
      sendBtn.style.backgroundColor = currentPrimary;
      sendBtn.style.boxShadow = `0 8px 20px -4px ${glowColor}`;
      sendBtn.onmouseover = () => {
        sendBtn.style.backgroundColor = privateRoom ? '#9333ea' : '#059669';
      };
      sendBtn.onmouseout = () => {
        sendBtn.style.backgroundColor = currentPrimary;
      };

      // Update Input Focus Rings
      [nameInput, feedbackInput].forEach(input => {
        if (privateRoom) {
          input.classList.remove('focus:ring-emerald-400', 'focus:border-emerald-400');
          input.classList.add('focus:ring-purple-400', 'focus:border-purple-400');
        } else {
          input.classList.remove('focus:ring-purple-400', 'focus:border-purple-400');
          input.classList.add('focus:ring-emerald-400', 'focus:border-emerald-400');
        }
      });

      privateBtnText.textContent = privateRoom ? PRIVATE_CODE : PUBLIC_CODE;
    }

    function loadFeedback() {
      const allMessages = getMessages();
      const filtered = allMessages.filter(m => m.private === privateRoom);
      feedbackList.innerHTML = '';

      filtered.forEach(f => {
        const li = document.createElement('li');
        li.className = 'py-2 px-3 bg-gray-700 rounded-lg shadow-inner break-words';

        const headerDiv = document.createElement('div');
        headerDiv.className = 'flex justify-between items-baseline mb-0.5';

        const nameSpan = document.createElement('span');
        nameSpan.className = 'font-bold transition-colors';
        nameSpan.style.color = privateRoom ? 'var(--private-primary)' : 'var(--public-primary)';
        nameSpan.textContent = maskBadWords(f.name);

        const timeSpan = document.createElement('span');
        timeSpan.className = 'text-xs text-gray-400';
        timeSpan.textContent = f.time || '';

        const msgSpan = document.createElement('div');
        msgSpan.className = 'whitespace-pre-wrap';
        msgSpan.textContent = maskBadWords(f.feedback);

        headerDiv.appendChild(nameSpan);
        headerDiv.appendChild(timeSpan);
        li.appendChild(headerDiv);
        li.appendChild(msgSpan);
        feedbackList.appendChild(li);
      });
    }

function sendMessage() {
const name = nameInput.value.trim();
const feedback = feedbackInput.value.trim();
if (!name || !feedback) {
alert("Please fill in both your name and message.");
return;
}
if (containsBadWords(feedback)) {
alert("Your message contains forbidden language. Please revise it before sending.");
return;
}
const now = new Date();
const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
const allMessages = getMessages();
allMessages.unshift({
id: Date.now(),
name,
feedback,
time: timeStr,
private: privateRoom
});
saveMessages(allMessages);
feedbackInput.value = '';
loadFeedback();
}
sendBtn.addEventListener('click', sendMessage);
feedbackInput.addEventListener('keydown', (e) => {
if (e.key === 'Enter' && !e.shiftKey) {
e.preventDefault();
sendMessage();
}
});
privateBtn.addEventListener('click', () => {
if (privateRoom) {
privateRoom = false;
updateTheme();
loadFeedback();
return;
}
const code = prompt("Enter private chat code:");
if (code === "savnaclive") {
privateRoom = true;
updateTheme();
loadFeedback();
} else {
alert("Incorrect code!");
}
});
deleteAllBtn.addEventListener('click', () => {
const pin = prompt("Enter PIN to delete all messages:");
if (pin !== "savnacsigma") {
alert("Incorrect PIN!");
return;
      }

      if (!confirm("Are you sure you want to delete all messages?")) return;

      const remaining = getMessages().filter(m => m.private !== privateRoom);
      saveMessages(remaining);
      loadFeedback();
    });

    document.getElementById('homeBtn').addEventListener('click', () => window.location.href = "index.html");

    window.addEventListener('storage', loadFeedback);

    updateTheme();
    loadFeedback();
  </script>
</body>
</html>
